name: assemble
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.html from parts
        run: |
          cat _staging/p0.html _staging/p1.html _staging/p2.html _staging/p3.html _staging/p4.html _staging/p5.html > index.html
          git rm -r -q --ignore-unmatch _staging assets/salesforce.webp assets/logo.svg
          wc -c index.html
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'Assemble v2 index.html from verified parts; remove unused files'
          git push
