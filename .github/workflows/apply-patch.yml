name: apply one-shot patch
on:
  push:
    paths:
      - '.github/patch/patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch/patch.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js
          git commit -m "Fix taps on mobile/tablet; Hyderabad, India; Agile/Waterfall; add Zoho CRM Client Script"
          git push
